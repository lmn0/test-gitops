apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: argocd-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack   # matches ruleSelector/ruleNamespaceSelector: {} (permissive), kept for clarity
spec:
  groups:
    - name: argocd.rules
      rules:
        - alert: ArgoCDAppOutOfSync
          expr: argocd_app_info{sync_status="OutOfSync"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} has been OutOfSync for 15m"
            description: >
              Application {{ $labels.name }} in project {{ $labels.project }} has been
              reporting sync_status=OutOfSync for at least 15 minutes. Auto-sync may be
              disabled or repeatedly failing.

        - alert: ArgoCDAppUnhealthy
          expr: argocd_app_info{health_status!~"Healthy|Progressing"} == 1
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: "Argo CD application {{ $labels.name }} is unhealthy"
            description: >
              Application {{ $labels.name }} has reported health_status={{ $labels.health_status }}
              for at least 15 minutes.

        - alert: ArgoCDSyncFailed
          expr: increase(argocd_app_sync_total{phase="Failed"}[30m]) > 0
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} had a failed sync"
            description: >
              At least one sync of {{ $labels.name }} failed in the last 30 minutes. Check
              `argocd app get {{ $labels.name }}` and the application-controller logs.

        - alert: ArgoCDComponentDown
          expr: up{namespace="argocd", job=~"argocd-.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Argo CD component {{ $labels.job }} is down"
            description: >
              Prometheus has not been able to scrape {{ $labels.job }} in namespace argocd
              for 5 minutes. The control plane itself may be degraded.

        - alert: ArgoCDHighReconciliationQueue
          expr: workqueue_depth{namespace="argocd", name="app_reconciliation_queue"} > 20
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application-controller reconciliation queue is backing up"
            description: >
              The app reconciliation workqueue depth has been above 20 for 10 minutes,
              indicating the controller is falling behind (often due to CPU throttling or
              a very large number of managed Applications).

        - alert: ArgoCDRepoServerErrorRate
          expr: |
            sum(rate(grpc_server_handled_total{namespace="argocd", grpc_service="repository.RepoServerService", grpc_code!="OK"}[10m]))
            /
            sum(rate(grpc_server_handled_total{namespace="argocd", grpc_service="repository.RepoServerService"}[10m]))
            > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD repo-server gRPC error rate above 5%"
            description: >
              More than 5% of repo-server RPCs (manifest generation, incl. helm/kustomize
              rendering) have failed over the last 10 minutes. Check repo-server logs --
              this is also where a bad Helm binary override would surface.
