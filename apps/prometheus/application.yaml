# apps/prometheus/application.yaml
#
# Deploys kube-prometheus-stack (Prometheus Operator + Prometheus + Grafana + Alertmanager)
# and layers on the Argo CD-specific extras (PrometheusRule alerts + Grafana dashboard
# ConfigMap) from this repo. Wave 1 so it lands after Argo CD's own Application (wave 0) has
# had a chance to reconcile and expose its ServiceMonitors.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 65.5.1
      helm:
        releaseName: kube-prometheus-stack
        valueFiles:
          - $values/apps/prometheus/values.yaml
    - repoURL: https://github.com/YOUR-ORG/gitops-argocd.git   # <-- replace with your repo URL
      targetRevision: main
      ref: values
    - repoURL: https://github.com/YOUR-ORG/gitops-argocd.git   # <-- replace with your repo URL
      targetRevision: main
      path: apps/prometheus/extras
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
