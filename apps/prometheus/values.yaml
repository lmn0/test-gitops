# apps/prometheus/values.yaml
# Values for prometheus-community/kube-prometheus-stack

prometheus:
  prometheusSpec:
    # Don't restrict ServiceMonitor discovery to ones carrying the chart's own release
    # label -- pick up the ServiceMonitors created by the argo-cd chart in the argocd
    # namespace (controller, server, repo-server, redis, applicationset, notifications).
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    serviceMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleNamespaceSelector: {}
    ruleSelector: {}
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi

grafana:
  enabled: true
  adminPassword: changeme-in-a-real-secret   # replace with a sealed-secret / external-secret in prod
  sidecar:
    dashboards:
      enabled: true
      # Grafana's sidecar watches ALL namespaces for ConfigMaps carrying this label and
      # auto-imports them -- this is how apps/prometheus/extras/argocd-dashboard-configmap.yaml
      # ends up showing up in Grafana with zero manual import steps.
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  defaultDashboardsEnabled: true

# Kept minimal: node-exporter/kube-state-metrics ship with the chart defaults and are left
# enabled since Argo CD's own dashboard also benefits from cluster-level context.
